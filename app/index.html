<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LvPrime · Coach workspace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1C1F23" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-content">
        <a class="logo" href="#/" aria-label="LvPrime, go to overview">
          <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <rect class="mark-tile" width="64" height="64" rx="16" />
            <rect class="mark-edge" x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" />
            <g stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path class="mark-ink" d="M16 19V48H24" />
              <path class="mark-ink" d="M26.5 28L35.5 48" />
              <path class="mark-rise" d="M35.5 48L49 13" />
            </g>
          </svg>
          <span class="logo-lockup">
            <span class="logo-text">Lv<em>Prime</em></span>
            <span class="logo-subtitle">Personal training · 40+</span>
          </span>
        </a>
        <div id="header-account" class="header-account">
          <span class="header-chip">Coach workspace</span>
        </div>
      </div>
    </header>
    <div class="shell">
      <aside id="sidebar" class="sidebar" aria-label="Clients" hidden></aside>
      <main id="app"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
